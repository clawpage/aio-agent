name: aio-agent-tauri
options:
  bundleIdPrefix: ai.clawpage.agent
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: AIOAgent
      PRODUCT_BUNDLE_IDENTIFIER: ai.clawpage.agent
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  aio-agent-tauri_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Exclude built static libs: regenerating with xcodegen after a build
      # otherwise turns the per-configuration libapp.a copies into colliding
      # resources ("Multiple commands produce …/libapp.a"). They are linked
      # via LIBRARY_SEARCH_PATHS, never bundled as resources.
      - path: Externals
        excludes: ["**/*.a"]
      - path: aio-agent-tauri_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
      # Home-screen name and permission prompts per language (Clawpage in English/Spanish, 一站 in Chinese).
      - path: Localization
    info:
      path: aio-agent-tauri_iOS/Info.plist
      properties:
        CFBundleDisplayName: 一站
        NSMicrophoneUsageDescription: 语音输入时录下你说的话，转成文字放进输入框。
        NSCameraUsageDescription: 拍照或录像作为附件发给一站。
        NSPhotoLibraryAddUsageDescription: 下载图片时存入你的相册。
        NSPhotoLibraryUsageDescription: 你在「iPhone 能力」里打开相册后，AI 按你的要求查找照片，把用到的几张缩小后发给一站。
        NSRemindersFullAccessUsageDescription: 你在「iPhone 能力」里打开提醒事项后，AI 按你的要求查看、添加和完成提醒事项。
        NSRemindersUsageDescription: 你在「iPhone 能力」里打开提醒事项后，AI 按你的要求查看、添加和完成提醒事项。
        NSCalendarsFullAccessUsageDescription: 你在「iPhone 能力」里打开日历后，AI 按你的要求查看日程、添加日程。
        NSCalendarsUsageDescription: 你在「iPhone 能力」里打开日历后，AI 按你的要求查看日程、添加日程。
        # Service workers (the console opening offline) need App-Bound Domains; navigation is then
        # limited to these registrable domains (the console and its workspace, the embedded players).
        WKAppBoundDomains: [localhost, clawpage.ai, youtube-nocookie.com, bilibili.com]
        LSRequiresIPhoneOS: true
        # HTTPS only, no proprietary encryption: App Store Connect skips the export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.2
        CFBundleVersion: "0.1.2"
    entitlements:
      path: aio-agent-tauri_iOS/aio-agent-tauri_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        # iPhone only: the console is a phone layout here, and iPad would need its own screenshots and review.
        TARGETED_DEVICE_FAMILY: "1"
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: SafariServices.framework
    preBuildScripts:
      - script: |
          npm run -- tauri ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
