<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#131219" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f4f8" media="(prefers-color-scheme: light)" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-title" content="一站" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>一站</title>
    <!-- The page before the app's script arrives: the theme's background and the loading mark
         (Brand.tsx LoadingMark, drawn with ruler and compass) where the app's own loading screen
         shows it next, so the construction carries on without a jump. The stylesheet is linked in
         the head of the built page, so the mark already animates; the colors in the attributes are
         copies of --brand-tile, --brand-line and --brand-stop for the moment before it (and in dev),
         and --bg below is a copy too (with manifest.webmanifest): change them with src/theme.css. -->
    <style>
      html, body { margin: 0; background: #131219; }
      @media (prefers-color-scheme: light) { html, body { background: #f5f4f8; } }
      .boot-splash { position: fixed; inset: 0; display: grid; place-items: center; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-splash" aria-label="加载中"><svg class="loading-mark" width="56" height="56" viewBox="0 0 40 40" aria-hidden="true"><rect class="lm-tile" width="40" height="40" rx="11" fill="#5a4fe0"/><g class="lm-draw"><rect class="lm-ruler" x="5" y="22.6" width="30" height="2.6" rx="0.8" fill="none"/><path class="lm-line lm-travelled" d="M7 20H20" pathLength="1" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/><path class="lm-line lm-ahead" d="M20 20h13" pathLength="1" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/><circle class="lm-station" cx="20" cy="20" r="6.8" pathLength="1" fill="#5a4fe0" stroke="#fff" stroke-width="3"/><circle class="lm-stop" cx="20" cy="20" r="3.2" fill="#ffb547"/><g class="lm-compass" fill="none" stroke="none"><path d="M24.2 9.6 20 20M24.2 9.6 26.8 20"/><circle cx="24.2" cy="9.6" r="1.3"/></g></g></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
