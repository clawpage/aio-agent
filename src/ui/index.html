<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#131219" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f4f8" media="(prefers-color-scheme: light)" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-title" content="一站" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>一站</title>
    <!-- The page before the app's script and styles arrive: the theme's background and the
         mark, breathing, where the app's own loading screen shows it next (no white flash).
         These colors are copies of --bg, --brand-tile, --brand-line and --brand-stop in
         src/theme.css (and manifest.webmanifest); change them together. -->
    <style>
      html, body { margin: 0; background: #131219; }
      @media (prefers-color-scheme: light) { html, body { background: #f5f4f8; } }
      .boot-splash { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot-splash svg { animation: boot-in .4s ease-out .15s both, boot-breathe 1.8s ease-in-out .55s infinite; }
      @keyframes boot-in { from { opacity: 0; transform: scale(.94); } }
      @keyframes boot-breathe { 50% { opacity: .72; transform: scale(.96); } }
      @media (prefers-reduced-motion: reduce) { .boot-splash svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-splash" aria-label="加载中"><svg width="44" height="44" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#5a4fe0"/><path d="M7 20H20" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/><path d="M20 20h13" stroke="#fff" stroke-opacity=".45" stroke-width="3.6" stroke-linecap="round"/><circle cx="20" cy="20" r="6.8" fill="#5a4fe0" stroke="#fff" stroke-width="3"/><circle cx="20" cy="20" r="3.2" fill="#ffb547"/></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
